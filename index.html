<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techfix Solutions | Premium IT Services</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b2545; color: #ffffff; line-height: 1.6; overflow-x: hidden; }

        /* Animated High-End Background Theme */
        .welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(-45deg, #0b2545, #134074, #003566, #000814);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 2rem;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Logo Styling */
        .top-logo {
            width: 110px;
            height: auto;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0px 4px 10px rgba(0, 242, 254, 0.4));
            transition: transform 0.3s ease;
        }
        .top-logo:hover { transform: scale(1.08); }

        .brand-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-size: 1.2rem;
            color: #8da9c4;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* Welcome Button */
        .welcome-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0b2545;
            padding: 0.9rem 2.8rem;
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 2.2rem;
            letter-spacing: 1px;
        }

        .welcome-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.6);
        }

        /* Profile Photo Styling */
        .profile-container {
            text-align: center;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            transition: transform 0.3s ease;
        }

        .profile-img:hover { transform: scale(1.05); }

        .owner-title {
            margin-top: 0.8rem;
            font-size: 1.1rem;
            color: #e0e1dd;
            font-weight: 600;
        }

        .owner-sub {
            font-size: 0.9rem;
            color: #8da9c4;
        }

        footer {
            background: #051329;
            color: #8da9c4;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .brand-title { font-size: 2.2rem; }
            .brand-tagline { font-size: 1rem; }
            .top-logo { width: 90px; }
            .profile-img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <!-- Professional First Page Layout -->
    <div class="welcome-screen">
        <!-- Top Logo -->
        <img src="logo.png" alt="Techfix Solutions Logo" class="top-logo" onerror="this.style.display='none'">

        <!-- Title & Tagline -->
        <h1 class="brand-title">Techfix Solutions</h1>
        <p class="brand-tagline">Complete IT & Technical Solutions Under One Roof</p>

        <!-- Only Welcome Button -->
        <a href="about.html" class="welcome-btn">Welcome</a>

        <!-- Profile Photo Section Below Welcome -->
        <div class="profile-container">
            <img src="profile.jpg" alt="Mohd Shahrukh" class="profile-img">
            <p class="owner-title">Mohd Shahrukh</p>
            <p class="owner-sub">Proprietor & IT Specialist</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Techfix Solutions | Bareilly, Uttar Pradesh</p>
    </footer>

</body>
</html>
