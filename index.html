<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFix Solutions - Welcome</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050b14;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .boot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      /* Soft Pulse and Blur Fade-In Animation */
      animation: emergeEffect 2.5s ease-out forwards;
    }

    /* Logo Styling + Soft Glow Effect */
    .logo-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 5px;
      background: #0d233a;
      border: 2px solid #00e5ff;
      /* Soft Glow Ring */
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6), inset 0 0 15px rgba(0, 229, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Brand Text */
    .brand-text {
      text-align: center;
    }

    /* TechFix Title */
    .brand-main {
      font-size: 3rem;
      font-weight: 900;
      color: #00e5ff;
      background: linear-gradient(180deg, #80f3ff 0%, #00c8fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    /* SOLUTIONS Subtitle */
    .brand-sub-container {
      border-top: 2px solid #00e5ff;
      border-bottom: 2px solid #00e5ff;
      padding: 2px 8px;
      margin-top: 5px;
      display: inline-block;
    }

    .brand-sub {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 8px;
    }

    /* Spinner Loader */
    .spinner {
      width: 35px;
      height: 35px;
      margin-top: 20px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top: 3px solid #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Smooth Emerge/Fade-In Keyframes */
    @keyframes emergeEffect {
      0% {
        opacity: 0;
        transform: scale(0.85);
        filter: blur(10px);
      }
      50% {
        opacity: 0.6;
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- 3 Second Redirect Script -->
  <script>
    setTimeout(function() {
      window.location.href = "home.html";
    }, 3000);
  </script>
</head>
<body>

  <div class="boot-container">
    <!-- Updated Logo File Name -->
    <div class="logo-ring">
      <img src="Logo.png" alt="TechFix Logo">
    </div>

    <!-- Text Block -->
    <div class="brand-text">
      <h1 class="brand-main">TechFix</h1>
      <div class="brand-sub-container">
        <span class="brand-sub">SOLUTIONS</span>
      </div>
    </div>

    <!-- Loader -->
    <div class="spinner"></div>
  </div>

</body>
</html>
