<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Solutions | IT Services</title>

    <style>
        /* =========================
           BASIC RESET & SMOOTH SCROLL
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #020b18;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* =========================
           TOP BANNER WITH BACKGROUND
        ========================= */
        .top-banner {
            position: relative;
            width: 100%;
            min-height: 180px; /* Adjust height based on banner */
            background: url('Picture1') no-repeat center center / cover; /* Yahan apni image file ka naam rakhein */
            display: flex;
            align-items: center;
            padding: 20px 30px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.2);
            border-bottom: 1px solid rgba(0, 207, 255, 0.3);
        }

        /* Dark overlay layer over banner image for text readability */
        .top-banner::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(2, 11, 24, 0.45);
            z-index: 1;
        }

        /* Clickable Home Link Wrapper */
        .brand-link {
            position: relative;
            z-index: 2; /* Content image ke upar rahega */
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-link:hover {
            transform: translateY(-4px);
        }

        /* Logo Ring Style */
        .logo-ring {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(3, 29, 53, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #00d9ff;
            padding: 5px;
            box-shadow: 0 0 15px #00d9ff, 0 0 30px rgba(0, 217, 255, 0.7), inset 0 0 15px rgba(0, 140, 255, 0.4);
            flex-shrink: 0;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .brand-link:hover .logo-ring {
            transform: scale(1.04);
            box-shadow: 0 10px 25px #00d9ff, 0 0 45px rgba(0, 217, 255, 0.9), inset 0 0 20px rgba(0, 140, 255, 0.6);
        }

        /* Brand Text Styling */
        .brand-text h1 {
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 10%, #d7eaff 40%, #00cfff 75%, #007cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 195, 255, 0.5);
            transition: text-shadow 0.3s ease;
        }

        .brand-link:hover .brand-text h1 {
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.9);
        }

        .brand-text h1 span {
            background: linear-gradient(180deg, #ffffff, #00eaff 55%, #008cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text h2 {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 10px;
            font-size: clamp(0.7rem, 1.2vw, 0.85rem);
            letter-spacing: 4px;
            font-weight: 500;
            color: #e2f7ff;
            border-top: 2px solid #00cfff;
            border-bottom: 2px solid #00cfff;
            text-shadow: 0 0 10px #00bfff;
        }

        /* =========================
           MAIN HERO SECTION
        ========================= */
        .hero {
            min-height: calc(100vh - 180px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 40px 20px; 
            background:
                radial-gradient(circle at 50% 50%, #064b85 0%, transparent 50%),
                radial-gradient(circle at 10% 60%, #003d70 0%, transparent 35%),
                radial-gradient(circle at 90% 65%, #003d70 0%, transparent 35%),
                linear-gradient(135deg, #020b18, #031d35, #00111f);
        }

        /* Animated Tech Grid Overlay */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 174, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 174, 255, 0.08) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 85%);
            pointer-events: none;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d9ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d9ff, 0 0 20px #008cff;
            animation: float 5s infinite ease-in-out;
        }

        .p1 { left: 8%; top: 25%; }
        .p2 { left: 18%; top: 45%; animation-delay: 1s; }
        .p3 { left: 85%; top: 28%; animation-delay: 2s; }
        .p4 { left: 92%; top: 50%; animation-delay: 3s; }
        .p5 { left: 12%; top: 75%; animation-delay: 1.5s; }
        .p6 { left: 80%; top: 72%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-30px);
                opacity: 1;
            }
        }

        /* =========================
           MAIN CONTENT BLOCK
        ========================= */
        .main-content-block {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-btn {
            width: 380px;
            max-width: 90%;
            padding: 16px 30px;
            border-radius: 50px;
            text-decoration: none;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: #001322;
            background: linear-gradient(90deg, #00eaff, #00aaff, #00eaff);
            box-shadow: 0 0 20px #00d9ff, 0 0 45px rgba(0, 200, 255, 0.6);
            transition: all 0.3s ease;
        }

        .welcome-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00eaff, 0 0 65px rgba(0, 200, 255, 0.85);
        }

        .welcome-btn span {
            margin-left: 15px;
            font-size: 1.5rem;
        }

        .tagline {
            margin-top: 40px;
            font-size: clamp(1rem, 2vw, 1.3rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d8f5ff;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        /* =========================
           SERVICES GRID
        ========================= */
        .services {
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 12px;
            padding: 10px;
        }

        .service {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 207, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 18px 8px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .service:hover {
            transform: translateY(-8px);
            background: rgba(0, 207, 255, 0.08);
            border-color: #00cfff;
            box-shadow: 0 8px 25px rgba(0, 207, 255, 0.25);
        }

        .service .icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid #00cfff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            background: rgba(0, 80, 140, 0.25);
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.4);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .service:hover .icon {
            box-shadow: 0 0 20px #00cfff;
            transform: scale(1.08);
        }

        .service p {
            margin: 0;
            font-size: 0.78rem;
            font-weight: 500;
            line-height: 1.3;
            color: #e2f7ff;
            letter-spacing: 0.3px;
        }

        .service .icon-aadhaar {
            background: rgba(255, 255, 255, 0.05);
            border-color: #ff9933;
        }

        /* =========================
           RESPONSIVE BREAKPOINTS
        ========================= */
        @media (max-width: 1200px) {
            .services {
                grid-template-columns: repeat(5, 1fr);
                gap: 15px;
            }
        }

        @media (max-width: 850px) {
            .top-banner {
                padding: 15px 20px;
                min-height: 140px;
            }
            .services {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        @media (max-width: 550px) {
            .logo-ring {
                width: 60px;
                height: 60px;
            }
            .services {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .welcome-btn {
                font-size: 1.1rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Smooth Scroll Handler -->
    <script>
        document.querySelector('.brand-link').addEventListener('click', function(e) {
            if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/' || window.location.pathname === '') {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

</body>
