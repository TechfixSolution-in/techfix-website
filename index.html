<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechFix Solutions | IT Services</title>

<style>
/* =========================
   BASIC RESET
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #020b18;
    color: white;
    overflow-x: hidden;
}

/* =========================
   MAIN HERO
========================= */
.hero {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; 
    padding: 20px; 
    background:
        radial-gradient(circle at 50% 50%, #064b85 0%, transparent 50%),
        radial-gradient(circle at 10% 60%, #003d70 0%, transparent 35%),
        radial-gradient(circle at 90% 65%, #003d70 0%, transparent 35%),
        linear-gradient(135deg, #020b18, #031d35, #00111f);
}

/* =========================
   ANIMATED TECH GRID
========================= */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 174, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 174, 255, 0.08) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
    pointer-events: none;
}

/* =========================
   GLOWING PARTICLES
========================= */
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #00d9ff;
    border-radius: 50%;
    box-shadow:
        0 0 8px #00d9ff,
        0 0 20px #008cff;
    animation: float 5s infinite ease-in-out;
}

.p1 { left: 8%; top: 25%; }
.p2 { left: 18%; top: 45%; animation-delay: 1s; }
.p3 { left: 85%; top: 28%; animation-delay: 2s; }
.p4 { left: 92%; top: 50%; animation-delay: 3s; }
.p5 { left: 12%; top: 75%; animation-delay: 1.5s; }
.p6 { left: 80%; top: 72%; animation-delay: 2.5s; }

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .5;
    }
    50% {
        transform: translateY(-30px);
        opacity: 1;
    }
}

/* =========================
   TOP NAV (ABSOLUTE)
========================= */
.top-nav {
    position: absolute;
    top: 25px;
    left: 25px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-ring {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: rgba(3, 29, 53, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    border: 3px solid #00d9ff;
    padding: 5px;
    box-shadow:
        0 0 15px #00d9ff,
        0 0 30px rgba(0, 217, 255, .7),
        inset 0 0 15px rgba(0, 140, 255, .4);
    flex-shrink: 0;
}

.logo-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.brand-text h1 {
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 10%, #d7eaff 40%, #00cfff 75%, #007cff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 195, 255, .5);
}

.brand-text h1 span {
    background: linear-gradient(180deg, #ffffff, #00eaff 55%, #008cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-text h2 {
    display: inline-block;
    margin-top: 3px;
    padding: 2px 10px;
    font-size: clamp(0.75rem, 1.5vw, 0.95rem);
    letter-spacing: 4px;
    font-weight: 500;
    color: #e2f7ff;
    border-top: 2px solid #00cfff;
    border-bottom: 2px solid #00cfff;
    text-shadow: 0 0 10px #00bfff;
}

/* ===================================================
   MAIN CONTENT BLOCK
====================================================== */
.main-content-block {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(2vh); 
}

/* TAGLINE */
.tagline {
    font-size: clamp(0.9rem, 2vw, 1.3rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #d8f5ff;
    text-align: center;
    text-shadow: 0 0 10px rgba(0,200,255,.5);
}

/* SERVICES */
.services {
    width: 100%;
    margin-top: 6vh;
    display: grid;
    grid-template-columns: repeat(8, 1fr); 
    gap: 15px;
}

.service {
    text-align: center;
    transition: .3s;
}

.service:hover {
    transform: translateY(-8px);
}

.icon {
    width: 72px;
    height: 72px;
    margin: auto;
    border-radius: 50%;
    border: 2px solid #00cfff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    background: rgba(0, 80, 140, .2);
    box-shadow:
        0 0 15px rgba(0,200,255,.5),
        inset 0 0 15px rgba(0,150,255,.25);
    transition: .3s;
}

.service:hover .icon {
    background: rgba(0, 200, 255, .2);
    box-shadow:
        0 0 25px #00d9ff,
        0 0 45px rgba(0,200,255,.6);
}

.service p {
    margin-top: 12px;
    font-size: 0.85rem;
    line-height: 1.35;
    color: #e2f7ff;
}

/* WELCOME BUTTON - BADHAYA HUA NICHE SHIFT GAP */
.welcome-btn {
    margin-top: 12vh; /* Button ko icons se kafi niche push karega */
    width: 380px;
    max-width: 90%;
    padding: 16px 30px;
    border-radius: 50px;
    text-decoration: none;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 800;
    color: #001322;
    background: linear-gradient(90deg, #00eaff, #00aaff, #00eaff);
    box-shadow:
        0 0 20px #00d9ff,
        0 0 45px rgba(0,200,255,.6);
    transition: .3s;
}

.welcome-btn:hover {
    transform: scale(1.05);
    box-shadow:
        0 0 30px #00eaff,
        0 0 65px rgba(0,200,255,.85);
}

.welcome-btn span {
    margin-left: 20px;
    font-size: 1.5rem;
}

/* =========================
   RESPONSIVE DESIGN
========================= */
@media(max-width: 1024px) {
    .top-nav {
        position: relative;
        top: 0;
        left: 0;
        margin-bottom: 20px;
    }
    
    .hero {
        justify-content: flex-start;
        padding-top: 20px;
    }

    .main-content-block {
        transform: none;
    }

    .services {
        grid-template-columns: repeat(4, 1fr);
        gap: 25px 15px;
    }
    
    .welcome-btn {
        margin-top: 60px;
    }
}

@media(max-width: 600px) {
    .logo-ring {
        width: 65px;
        height: 65px;
    }

    .services {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px 10px;
    }

    .welcome-btn {
        margin-top: 45px;
    }
}
</style>
</head>

<body>

    <div class="services">
        <div class="service">

        </div>

            <div class="icon">🖨️</div>

        </div>
        <div class="service">
            <div class="icon">⚙️</div>

        <div class="service">

        </div>

        </div>
        <div class="service">

        </div>
    </div>

    <a href="about.html" class="welcome-btn">
        Welcome <span>→</span>
    </a>

</div>

</section>

</body>
</html>
