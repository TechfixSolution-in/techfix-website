<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Solutions | IT Services</title>

    <style>
        /* =========================
           RESET & GLOBAL STYLING
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Main Page Background Setup */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            /* Test Image (Aggar local image 'bg-image.jpg' nahi milegi to yeh load hogi) */
            background-image: linear-gradient(rgba(3, 15, 30, 0.8), rgba(3, 15, 30, 0.8)), 
                              url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #020b18; 
        }

        /* =========================
           TOP BANNER
        ========================= */
        .top-banner {
            width: 100%;
            padding: 20px 30px;
            background: rgba(2, 11, 24, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 207, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        .brand-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(3, 29, 53, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #00d9ff;
            box-shadow: 0 0 15px #00d9ff;
            font-weight: bold;
            color: #00d9ff;
        }

        .brand-text h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff, #00cfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text h2 {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #e2f7ff;
            border-top: 1px solid #00cfff;
            border-bottom: 1px solid #00cfff;
            padding: 2px 5px;
        }

        /* =========================
           HERO SECTION
        ========================= */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            padding: 80px 20px 40px; 
            text-align: center;
        }

        .main-content-block {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-btn {
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            color: #001322;
            background: linear-gradient(90deg, #00eaff, #00aaff);
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.8);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .welcome-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px #00eaff;
        }

        .tagline {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d8f5ff;
            margin-bottom: 40px;
            text-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
        }

        /* =========================
           SERVICES GRID
        ========================= */
        .services {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .service {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 207, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service:hover {
            transform: translateY(-5px);
            background: rgba(0, 207, 255, 0.15);
            border-color: #00cfff;
            box-shadow: 0 5px 20px rgba(0, 207, 255, 0.4);
        }

        .service .icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #00cfff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            background: rgba(0, 80, 140, 0.3);
            margin: 0 auto 10px auto;
        }

        .service p {
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2f7ff;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <header class="top-banner">
        <a href="#" class="brand-link">
            <div class="logo-ring">TF</div>
            <div class="brand-text">
                <h1>TECHFIX</h1>
                <h2>SOLUTIONS</h2>
            </div>
        </a>
    </header>

    <!-- Main Hero Section -->
    <main class="hero">
        <div class="main-content-block">
            <a href="#" class="welcome-btn">WELCOME TO TECHFIX</a>
            <p class="tagline">Your Trusted IT & Software Partner</p>

            <!-- Services Grid -->
            <div class="services">
                <div class="service">
                    <div class="icon">💻</div>
                    <p>Hardware Repair</p>
                </div>
                <div class="service">
                    <div class="icon">🌐</div>
                    <p>Networking</p>
                </div>
                <div class="service">
                    <div class="icon">⚙️</div>
                    <p>Software Automation</p>
                </div>
                <div class="service">
                    <div class="icon">🔒</div>
                    <p>Cyber Security</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
